<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyári programok</title>
    <link rel="stylesheet" href="style.css">
</head>

    <body>

        <h1>Nyári terveim 2026</h1>
        <h2>A főbb terveim</h2>
        <div class="notes">
            <div class="sticky" onclick="showInfo('country')">Lengyel ország</div>
            <div class="sticky" onclick="showInfo('budapest')">Budapest</div>
            <div class="sticky" onclick="showInfo('books')">Könyvek</div>
        </div>

        <h2>Egyéb terveim</h2>
        <div class="notes">
            <div class="sticky" onclick="showInfo('minecraft')">Minecraft</div>
            <div class="sticky" onclick="showInfo('friends')">Barátok</div>
            <div class="sticky" onclick="showInfo('youtube')">YouTube</div>
        </div>

        <div id="info-panel">
            <h2>Válassz egy cetlit!</h2>
            <p>Kattints egy sticky note-ra a részletekért.</p>
        </div>

        <script src="script.js"></script>
    </body>
</html>
